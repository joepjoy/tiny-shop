# What Argo CD deploys: the k8s/ files with the images CI published.
# CI updates newTag after every build. Don't edit it by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../k8s
images:
  - name: tiny-shop-api
    newName: ghcr.io/joepjoy/tiny-shop-api
    newTag: 1289ebd259859c5bbbc0a92fec969dc5378d1a1c
  - name: tiny-shop-frontend
    newName: ghcr.io/joepjoy/tiny-shop-frontend
    newTag: 1289ebd259859c5bbbc0a92fec969dc5378d1a1c
