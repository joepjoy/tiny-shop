apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tiny-shop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/joepjoy/tiny-shop.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: tiny-shop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: api
      jsonPointers:
        - /spec/replicas
