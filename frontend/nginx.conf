server {
    listen 80;

    # Serve the web page
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Send /api requests to the API service.
    # "api" is the service name; Docker Compose and Kubernetes both turn it into an address.
    location /api/ {
        proxy_pass http://api:5000;
    }
}
