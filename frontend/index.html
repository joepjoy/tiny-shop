<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiny Shop</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { margin-bottom: 0; }
    .muted { color: #777; font-size: 0.85rem; }
    .product { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 0; border-bottom: 1px solid #eee; }
    button { background: #326ce5; color: white; border: 0; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; }
    ul { padding-left: 1.2rem; }
  </style>
</head>
<body>
  <h1>Tiny Shop</h1>
  <p class="muted">Running on Kubernetes. Served by pod: <span id="pod">...</span></p>

  <h2>Products</h2>
  <div id="products">Loading...</div>

  <h2>Recent orders</h2>
  <ul id="orders"></ul>

  <script>
    async function loadProducts() {
      const res = await fetch("/api/products");
      const data = await res.json();
      document.getElementById("pod").textContent = data.served_by;
      document.getElementById("products").innerHTML = data.products.map(p => `
        <div class="product">
          <span>${p.name} <span class="muted">$${p.price.toFixed(2)}</span></span>
          <button onclick="buy(${p.id})">Buy</button>
        </div>`).join("");
    }

    async function loadOrders() {
      const res = await fetch("/api/orders");
      const data = await res.json();
      document.getElementById("orders").innerHTML =
        data.orders.map(o => `<li>#${o.id}: ${o.product} ($${o.price.toFixed(2)})</li>`).join("") || "<li>No orders yet</li>";
    }

    async function buy(id) {
      await fetch("/api/orders", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ product_id: id }),
      });
      loadOrders();
      loadProducts();
    }

    loadProducts();
    loadOrders();
  </script>
</body>
</html>
