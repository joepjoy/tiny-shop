apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tiny-shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: tiny-shop-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
---
# NodePort opens the frontend on port 30080, which kind-config.yaml maps to localhost:8080.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tiny-shop
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
