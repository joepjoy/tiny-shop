# Redis is the database that stores orders.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: tiny-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
# A Service gives Redis a stable name ("redis") that other pods can reach.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: tiny-shop
spec:
  selector:
    app: redis
  ports:
    - port: 6379
