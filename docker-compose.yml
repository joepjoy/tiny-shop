# Step 1 of the guide: run everything on your laptop with one command.
#   docker compose up --build
# Then open http://localhost:8080
services:
  redis:
    image: redis:7-alpine

  api:
    build: ./api
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
