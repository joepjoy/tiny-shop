# Creates a one-node Kubernetes cluster on your laptop.
# Port 30080 inside the cluster is opened as http://localhost:8080 on your laptop.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: tiny-shop
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
